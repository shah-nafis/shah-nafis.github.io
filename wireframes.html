<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nafis Portfolio — Wireframe Explorations</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f0; font-family: 'Inter', sans-serif; }

  /* Sketchy / hand-drawn feel */
  .sketch-box {
    border: 2px solid #1a1a2e;
    border-radius: 2px;
    position: relative;
  }
  .sketch-box::after {
    content: '';
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(26,26,46,0.15);
    border-radius: 1px;
    pointer-events: none;
  }
  .sketch-fill-blue { background: #4169E1; }
  .sketch-fill-light { background: #EEF2FF; }
  .sketch-fill-gray { background: #e0e0e0; }
  .sketch-fill-mid { background: #c8c8c8; }
  .sketch-fill-dark { background: #1a1a2e; }
  .sketch-fill-white { background: #fff; }

  .sketch-label {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    color: #555;
    text-align: center;
  }
  .sketch-label-blue {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    color: #4169E1;
    text-align: center;
    font-weight: 600;
  }
  .sketch-heading {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    color: #1a1a2e;
    line-height: 1.2;
  }
  .sketch-subheading {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    color: #4169E1;
  }
  .annotation {
    font-family: 'Caveat', cursive;
    font-size: 12px;
    color: #888;
    font-style: italic;
  }
  .tag {
    display: inline-block;
    padding: 1px 6px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    font-family: 'Caveat', cursive;
    font-size: 11px;
  }
  .tag-blue { color: #4169E1; }
  .tag-dark { color: #1a1a2e; }

  /* Divider lines (sketchy) */
  .hatch {
    background-image: repeating-linear-gradient(
      45deg, transparent, transparent 3px, rgba(26,26,46,0.12) 3px, rgba(26,26,46,0.12) 4px
    );
  }
  .dots {
    background-image: radial-gradient(circle, rgba(26,26,46,0.25) 1px, transparent 1px);
    background-size: 5px 5px;
  }

  .option-label {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .option-desc {
    font-family: 'Caveat', cursive;
    font-size: 14px;
    color: #666;
    margin-bottom: 16px;
    max-width: 340px;
  }

  .canvas-wrap {
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 64px;
  }

  .two-up {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }

  .wireframe-browser {
    border: 2px solid #1a1a2e;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .browser-bar {
    height: 24px;
    background: #f0f0f0;
    border-bottom: 1.5px solid #1a1a2e;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 4px;
  }
  .browser-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1.5px solid #1a1a2e;
  }

  /* Sketch line placeholder */
  .sketch-line {
    height: 8px;
    background: #ddd;
    border-radius: 2px;
  }
  .sketch-line-blue {
    height: 8px;
    background: #4169E1;
    border-radius: 2px;
    opacity: 0.7;
  }
  .sketch-line-dark {
    height: 10px;
    background: #1a1a2e;
    border-radius: 2px;
  }
  .sketch-line-sm {
    height: 6px;
    background: #e0e0e0;
    border-radius: 2px;
  }

  .avatar-circle {
    border-radius: 50%;
    background: #4169E1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Caveat', cursive;
    color: white;
    font-weight: 700;
    border: 2px solid #1a1a2e;
    flex-shrink: 0;
  }

  /* Timeline dot */
  .tl-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #4169E1;
    border: 2px solid #1a1a2e;
    flex-shrink: 0;
  }
  .tl-line {
    width: 2px;
    background: #ccc;
    flex: 1;
    min-height: 24px;
  }
  .tl-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .note-bubble {
    background: #fffde7;
    border: 1.5px dashed #bbb;
    border-radius: 4px;
    padding: 6px 10px;
    font-family: 'Caveat', cursive;
    font-size: 12px;
    color: #888;
    font-style: italic;
  }

  hr.sketch {
    border: none;
    border-top: 2px dashed #ccc;
    margin: 0;
  }
</style>
</head>
<body>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

const { useState } = React;

/* ── Shared sketch primitives ── */

const Line = ({ w = '100%', color = '#ddd', h = 7, mt = 0, mb = 0 }) => (
  <div style={{ height: h, background: color, borderRadius: 2, width: w, marginTop: mt, marginBottom: mb, flexShrink: 0 }} />
);

const Lines = ({ count = 3, gap = 5, last = 0.7, color = '#ddd', h = 7 }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap }}>
    {Array.from({ length: count }).map((_, i) => (
      <Line key={i} w={i === count - 1 ? `${last * 100}%` : '100%'} color={color} h={h} />
    ))}
  </div>
);

const BtnFill = ({ label, small }) => (
  <div style={{
    background: '#4169E1', color: '#fff',
    padding: small ? '3px 10px' : '5px 14px',
    borderRadius: 3, border: '2px solid #1a1a2e',
    fontFamily: 'Caveat', fontSize: small ? 11 : 13, fontWeight: 700,
    display: 'inline-block', whiteSpace: 'nowrap'
  }}>{label}</div>
);

const BtnOutline = ({ label, small }) => (
  <div style={{
    background: '#fff', color: '#4169E1',
    padding: small ? '3px 10px' : '5px 14px',
    borderRadius: 3, border: '2px solid #4169E1',
    fontFamily: 'Caveat', fontSize: small ? 11 : 13, fontWeight: 700,
    display: 'inline-block', whiteSpace: 'nowrap'
  }}>{label}</div>
);

const SkillTag = ({ label }) => (
  <span style={{
    display: 'inline-block', padding: '2px 7px',
    background: '#EEF2FF', border: '1.5px solid #4169E1',
    borderRadius: 3, fontFamily: 'Caveat', fontSize: 11, color: '#4169E1',
    marginRight: 3, marginBottom: 3
  }}>{label}</span>
);

const Box = ({ w, h, color = '#e0e0e0', style = {} }) => (
  <div style={{ width: w, height: h, background: color, border: '1.5px solid #1a1a2e', borderRadius: 2, flexShrink: 0, ...style }} />
);

const Avatar = ({ size = 40 }) => (
  <div style={{
    width: size, height: size, borderRadius: '50%',
    background: '#4169E1', border: '2px solid #1a1a2e',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    fontFamily: 'Caveat', color: '#fff', fontWeight: 700,
    fontSize: size * 0.35, flexShrink: 0
  }}>SNA</div>
);

const NavBar = ({ items = ['About','Experience','Skills','Education','Certs','Contact'], logo = true }) => (
  <div style={{
    height: 32, background: '#fff', borderBottom: '1.5px solid #e0e0e0',
    display: 'flex', alignItems: 'center', padding: '0 16px', gap: 14
  }}>
    {logo && <span style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 14, color: '#1a1a2e', marginRight: 8 }}>Nafis.</span>}
    <div style={{ flex: 1 }} />
    {items.map(it => (
      <span key={it} style={{ fontFamily: 'Caveat', fontSize: 11, color: it === 'About' ? '#4169E1' : '#888' }}>{it}</span>
    ))}
    <Box w={24} h={18} color="#4169E1" style={{ borderRadius: 3 }} />
  </div>
);

const SectionTitle = ({ label }) => (
  <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 16, color: '#1a1a2e', marginBottom: 8 }}>
    {label}
    <div style={{ height: 3, width: 30, background: '#4169E1', borderRadius: 2, marginTop: 2 }} />
  </div>
);

const TlCard = () => (
  <div style={{ display: 'flex', gap: 8 }}>
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#4169E1', border: '2px solid #1a1a2e', flexShrink: 0 }} />
      <div style={{ width: 2, flex: 1, background: '#ddd', minHeight: 16 }} />
    </div>
    <div style={{ flex: 1, background: '#fafafa', border: '1.5px solid #e0e0e0', borderRadius: 3, padding: '6px 8px', marginBottom: 8 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
        <Lines count={1} color='#1a1a2e' h={8} w='55%' />
        <span style={{ fontFamily: 'Caveat', fontSize: 10, color: '#4169E1', border: '1px solid #4169E1', padding: '1px 4px', borderRadius: 2 }}>B2B SaaS</span>
      </div>
      <Lines count={2} color='#ddd' h={6} gap={3} last={0.6} />
    </div>
  </div>
);

/* ═══════════════════════════════════════════════════════
   OPTION A — Classic Single-Column Scroll
   ═══════════════════════════════════════════════════════ */
const OptionA = () => (
  <div className="wireframe-browser" style={{ width: 340 }}>
    <div className="browser-bar">
      {['#E74C3C','#F39C12','#2ECC71'].map(c => <div key={c} className="browser-dot" style={{ background: c }} />)}
      <div style={{ flex: 1, height: 10, background: '#ddd', borderRadius: 8, marginLeft: 6 }} />
    </div>

    {/* Nav */}
    <NavBar />

    {/* Hero */}
    <div style={{ background: '#fff', padding: '20px 16px', borderBottom: '1.5px solid #f0f0f0' }}>
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
        <Avatar size={48} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 18, color: '#1a1a2e', marginBottom: 2 }}>Shah Nafis Ahammed</div>
          <div style={{ fontFamily: 'Caveat', fontSize: 12, color: '#4169E1', marginBottom: 6 }}>AI Specialist · Ops · Dhaka, BD</div>
          <div style={{ height: 6, background: '#ccc', borderRadius: 2, marginBottom: 3, width: '90%' }} />
          <div style={{ height: 6, background: '#ccc', borderRadius: 2, marginBottom: 3, width: '75%' }} />
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <BtnFill label="View My Work" small />
            <BtnOutline label="LinkedIn" small />
          </div>
        </div>
      </div>
      {/* Typing animation indicator */}
      <div style={{ marginTop: 10, padding: '4px 8px', background: '#EEF2FF', border: '1.5px dashed #4169E1', borderRadius: 3 }}>
        <span style={{ fontFamily: 'Caveat', fontSize: 11, color: '#4169E1' }}>✦ typing: "AI Specialist" | "Ops Builder" | "Product Thinker"</span>
      </div>
    </div>

    {/* About */}
    <div style={{ padding: '12px 16px', borderBottom: '1.5px solid #f0f0f0' }}>
      <SectionTitle label="About Me" />
      <Lines count={3} h={6} gap={4} last={0.7} />
      <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
        {['✉ Email','🔗 LinkedIn','📍 Dhaka'].map(i => (
          <span key={i} style={{ fontFamily: 'Caveat', fontSize: 10, color: '#666' }}>{i}</span>
        ))}
      </div>
    </div>

    {/* Experience */}
    <div style={{ padding: '12px 16px', borderBottom: '1.5px solid #f0f0f0', background: '#fafafa' }}>
      <SectionTitle label="Experience" />
      <TlCard /><TlCard /><TlCard />
      <div className="annotation" style={{ marginTop: 2 }}>+ 3 more roles</div>
    </div>

    {/* Skills */}
    <div style={{ padding: '12px 16px', borderBottom: '1.5px solid #f0f0f0' }}>
      <SectionTitle label="Skills" />
      <div style={{ display: 'flex', flexWrap: 'wrap' }}>
        {['AI Agent Building','Prompt Eng.','RLHF','Python','Tableau','Zapier','SQL','Figma'].map(s => (
          <SkillTag key={s} label={s} />
        ))}
      </div>
    </div>

    {/* Education */}
    <div style={{ padding: '12px 16px', borderBottom: '1.5px solid #f0f0f0', background: '#fafafa' }}>
      <SectionTitle label="Education" />
      <div style={{ border: '1.5px solid #e0e0e0', borderRadius: 3, padding: '8px 10px', background: '#fff' }}>
        <Line w="70%" color="#1a1a2e" h={8} mb={4} />
        <Lines count={2} h={6} gap={3} last={0.5} />
        <div style={{ marginTop: 6, fontFamily: 'Caveat', fontSize: 10, color: '#4169E1' }}>Magna Cum Laude · CGPA 3.72</div>
      </div>
    </div>

    {/* Footer */}
    <div style={{ padding: '10px 16px', background: '#1a1a2e', textAlign: 'center' }}>
      <div style={{ fontFamily: 'Caveat', fontSize: 12, color: '#fff' }}>Let's build something intelligent.</div>
      <div style={{ fontFamily: 'Caveat', fontSize: 10, color: '#888', marginTop: 2 }}>© 2026 Shah Nafis Ahammed</div>
    </div>
  </div>
);

/* ═══════════════════════════════════════════════════════
   OPTION B — Left Sidebar Fixed Nav
   ═══════════════════════════════════════════════════════ */
const OptionB = () => (
  <div className="wireframe-browser" style={{ width: 380 }}>
    <div className="browser-bar">
      {['#E74C3C','#F39C12','#2ECC71'].map(c => <div key={c} className="browser-dot" style={{ background: c }} />)}
      <div style={{ flex: 1, height: 10, background: '#ddd', borderRadius: 8, marginLeft: 6 }} />
    </div>
    <div style={{ display: 'flex', height: 440 }}>
      {/* Sidebar */}
      <div style={{ width: 100, background: '#1a1a2e', padding: '16px 12px', display: 'flex', flexDirection: 'column', gap: 8, flexShrink: 0 }}>
        <Avatar size={36} />
        <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 13, color: '#fff', marginTop: 4, lineHeight: 1.2 }}>Shah Nafis</div>
        <div style={{ height: 1, background: '#333', margin: '4px 0' }} />
        {['About','Experience','Skills','Education','Certs','Contact'].map((it, i) => (
          <div key={it} style={{
            fontFamily: 'Caveat', fontSize: 12,
            color: i === 1 ? '#4169E1' : '#aaa',
            display: 'flex', alignItems: 'center', gap: 4,
            borderLeft: i === 1 ? '2px solid #4169E1' : '2px solid transparent',
            paddingLeft: 4
          }}>{it}</div>
        ))}
        <div style={{ flex: 1 }} />
        <Box w={20} h={20} color="#4169E1" style={{ borderRadius: 3 }} />
      </div>

      {/* Main content */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '12px 14px', background: '#fff' }}>
        {/* Hero strip at top */}
        <div style={{ padding: '12px 0', borderBottom: '1.5px solid #f0f0f0', marginBottom: 12 }}>
          <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 17, color: '#1a1a2e' }}>AI Specialist · Product & Ops</div>
          <div style={{ fontFamily: 'Caveat', fontSize: 11, color: '#4169E1', marginBottom: 6 }}>Builder-operator at the intersection of AI, SaaS & business ops</div>
          <div style={{ display: 'flex', gap: 6 }}>
            <BtnFill label="View Work" small />
            <BtnOutline label="LinkedIn" small />
          </div>
          <div style={{ marginTop: 6, background: '#EEF2FF', border: '1px dashed #4169E1', padding: '3px 6px', borderRadius: 3 }}>
            <span style={{ fontFamily: 'Caveat', fontSize: 10, color: '#4169E1' }}>typing: "Operations Builder" _</span>
          </div>
        </div>

        {/* Experience */}
        <SectionTitle label="Experience" />
        <TlCard /><TlCard />

        {/* Skills grid */}
        <SectionTitle label="Skills" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginBottom: 10 }}>
          {[['Artificial Intelligence','AI agents, RLHF, SFT'],['BI & Data','Tableau, SQL, Python'],['Automation','Zapier, n8n, GAS'],['CRM / PSA','Salesforce, Monday']].map(([cat, tags]) => (
            <div key={cat} style={{ border: '1.5px solid #e0e0e0', borderRadius: 3, padding: '6px 8px' }}>
              <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 11, color: '#1a1a2e', marginBottom: 3 }}>{cat}</div>
              <div style={{ fontFamily: 'Caveat', fontSize: 10, color: '#4169E1' }}>{tags}</div>
            </div>
          ))}
        </div>

        {/* Education mini card */}
        <SectionTitle label="Education" />
        <div style={{ border: '1.5px solid #4169E1', borderRadius: 3, padding: '6px 8px', background: '#EEF2FF' }}>
          <Line w="60%" color="#1a1a2e" h={8} mb={4} />
          <Lines count={2} h={5} gap={3} last={0.5} />
          <div style={{ fontFamily: 'Caveat', fontSize: 10, color: '#4169E1', marginTop: 4 }}>Magna Cum Laude · 3.72</div>
        </div>
      </div>
    </div>
  </div>
);

/* ═══════════════════════════════════════════════════════
   OPTION C — Split Hero + Bento Grid Content
   ═══════════════════════════════════════════════════════ */
const OptionC = () => (
  <div className="wireframe-browser" style={{ width: 360 }}>
    <div className="browser-bar">
      {['#E74C3C','#F39C12','#2ECC71'].map(c => <div key={c} className="browser-dot" style={{ background: c }} />)}
      <div style={{ flex: 1, height: 10, background: '#ddd', borderRadius: 8, marginLeft: 6 }} />
    </div>

    <NavBar />

    {/* Split hero */}
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', borderBottom: '1.5px solid #e0e0e0' }}>
      <div style={{ background: '#1a1a2e', padding: '20px 14px', minHeight: 140 }}>
        <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 18, color: '#fff', lineHeight: 1.2, marginBottom: 6 }}>Shah<br/>Nafis<br/>Ahammed</div>
        <div style={{ fontFamily: 'Caveat', fontSize: 11, color: '#4169E1', marginBottom: 8 }}>AI Specialist · Ops</div>

      <div style={{ background: '#EEF2FF', padding: '20px 14px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
        <Avatar size={56} />
        <div style={{ fontFamily: 'Caveat', fontSize: 11, color: '#4169E1', background: '#fff', border: '1.5px dashed #4169E1', padding: '3px 8px', borderRadius: 3, textAlign: 'center' }}>
          "Operations Builder" _
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          <BtnFill label="Work" small />
          <BtnOutline label="LinkedIn" small />
        </div>
      </div>
    </div>

    {/* Bento grid */}
    <div style={{ padding: '10px', display: 'grid', gridTemplateColumns: '1fr 1fr', gridTemplateRows: 'auto', gap: 8, background: '#fafafa' }}>
      {/* Big card — experience */}
      <div style={{ gridColumn: '1/-1', background: '#fff', border: '1.5px solid #e0e0e0', borderRadius: 4, padding: '10px 12px' }}>
        <SectionTitle label="Experience" />

        </div>
      </div>

      {/* Education */}
      <div style={{ background: '#4169E1', border: '1.5px solid #1a1a2e', borderRadius: 4, padding: '10px 12px' }}>
        <div style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 14, color: '#fff', marginBottom: 6 }}>Education</div>
        <Lines count={2} h={6} gap={3} color="rgba(255,255,255,0.5)" last={0.6} />
        <div style={{ fontFamily: 'Caveat', fontSize: 10, color: '#fff', marginTop: 6, opacity: 0.9 }}>Magna Cum Laude · 3.72</div>
      </div>

      {/* Certs */}
      <div style={{ gridColumn: '1/-1', background: '#fff', border: '1.5px solid #e0e0e0', borderRadius: 4, padding: '10px 12px' }}>
        <SectionTitle label="Certs & Awards" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
          <Lines count={3} h={5} gap={3} last={0.6} />
          <div>
            {['🏆 Cassessination 2.0','🏆 Nat. Entrepreneurship','🥈 Communicado 2023'].map(a => (
              <div key={a} style={{ fontFamily: 'Caveat', fontSize: 10, color: '#555', marginBottom: 2 }}>{a}</div>
            ))}
          </div>

    <div style={{ padding: '8px 16px', background: '#1a1a2e', textAlign: 'center' }}>
      <div style={{ fontFamily: 'Caveat', fontSize: 11, color: '#aaa' }}>Let's build something intelligent. · © 2026</div>
    </div>
